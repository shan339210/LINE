<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野原家出遊記帳小幫手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #FEF08A;
    }
    .neo-card {
      border: 3px solid #1E293B;
      box-shadow: 4px 4px 0px #1E293B;
      border-radius: 1rem;
    }
    .neo-btn {
      border: 2px solid #1E293B;
      box-shadow: 3px 3px 0px #1E293B;
      transition: all 0.1s ease;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1E293B;
    }
    .tab-btn.active {
      background-color: #FF3B30;
      color: white;
    }
  </style>
</head>
<body class="p-3 sm:p-5 max-w-md mx-auto min-h-screen pb-12">

  <!-- Header -->
  <div class="neo-card bg-red-500 text-white p-4 mb-4 text-center relative overflow-hidden">
    <div class="flex items-center justify-center gap-3">
      <!-- 蠟筆小新 SVG -->
      <svg class="w-12 h-12" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#FFCC00" stroke="#1E293B" stroke-width="4"/>
        <path d="M 20 40 Q 35 20 50 40" stroke="#1E293B" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M 50 40 Q 65 20 80 40" stroke="#1E293B" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle cx="35" cy="52" r="5" fill="#1E293B"/>
        <circle cx="65" cy="52" r="5" fill="#1E293B"/>
        <ellipse cx="25" cy="62" rx="6" ry="4" fill="#FF8888"/>
        <ellipse cx="75" cy="62" rx="6" ry="4" fill="#FF8888"/>
        <path d="M 40 70 Q 50 82 60 70" stroke="#1E293B" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="text-left">
        <h1 class="text-xl font-black tracking-wide">野原家出遊記帳</h1>
        <p class="text-xs bg-yellow-300 text-black px-2 py-0.5 rounded-full font-bold inline-block mt-1">動感光波分帳版 ✨</p>
      </div>
    </div>
  </div>

  <!-- 分頁按鈕 -->
  <div class="flex gap-2 mb-4">
    <button id="tab1" onclick="switchTab(1)" class="tab-btn active flex-1 neo-btn py-2 font-bold rounded-xl bg-white text-slate-800">📝 新增記帳</button>
    <button id="tab2" onclick="switchTab(2)" class="tab-btn flex-1 neo-btn py-2 font-bold rounded-xl bg-white text-slate-800">📋 帳目明細</button>
    <button id="tab3" onclick="switchTab(3)" class="tab-btn flex-1 neo-btn py-2 font-bold rounded-xl bg-white text-slate-800">⚡ 快速結算</button>
  </div>

  <!-- 頁籤 1: 新增記帳 -->
  <div id="page1" class="neo-card bg-white p-4 mb-4">
    <h2 class="font-black text-lg mb-3 flex items-center gap-2">
      <span>🖍️</span> 新增消費項目
    </h2>

    <div class="space-y-3 text-sm font-bold">
      <div>
        <label class="block text-slate-600 mb-1">消費名稱</label>
        <input type="text" id="itemTitle" placeholder="例：巧克比餅乾、雙葉車票" class="w-full border-2 border-slate-800 rounded-lg p-2 bg-slate-50 focus:outline-none">
      </div>

      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-slate-600 mb-1">金額</label>
          <input type="number" id="itemAmount" placeholder="0" class="w-full border-2 border-slate-800 rounded-lg p-2 bg-slate-50 focus:outline-none">
        </div>
        <div class="w-1/3">
          <label class="block text-slate-600 mb-1">幣別</label>
          <select id="itemCurrency" class="w-full border-2 border-slate-800 rounded-lg p-2 bg-slate-50 focus:outline-none">
            <option value="TWD">TWD (NT$)</option>
            <option value="JPY">JPY (￥)</option>
            <option value="KRW">KRW (₩)</option>
            <option value="USD">USD ($)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-slate-600 mb-1">類別</label>
        <select id="itemCategory" class="w-full border-2 border-slate-800 rounded-lg p-2 bg-slate-50 focus:outline-none">
          <option value="🍔 餐飲美食">🍔 餐飲美食</option>
          <option value="🚌 交通車票">🚌 交通車票</option>
          <option value="🏠 住宿飯店">🏠 住宿飯店</option>
          <option value="🎟️ 景點門票">🎟️ 景點門票</option>
          <option value="🛍️ 購物戰利品">🛍️ 購物戰利品</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-600 mb-1">誰先付錢的？</label>
        <select id="itemPayer" class="w-full border-2 border-slate-800 rounded-lg p-2 bg-slate-50 focus:outline-none">
          <!-- 動態載入成員 -->
        </select>
      </div>

      <button onclick="addExpense()" class="w-full neo-btn bg-yellow-400 font-black py-3 rounded-xl text-base mt-2">
        ✨ 記下一筆帳！
      </button>
    </div>
  </div>

  <!-- 成員管理卡片 -->
  <div class="neo-card bg-white p-4 mb-4">
    <h2 class="font-black text-base mb-2 flex justify-between items-center">
      <span>👥 出遊小夥伴</span>
      <span id="memberCount" class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">3 人</span>
    </h2>
    <div id="memberList" class="flex flex-wrap gap-1.5 mb-3">
      <!-- 動態載入成員標籤 -->
    </div>
    <div class="flex gap-2">
      <input type="text" id="newMemberName" placeholder="新增人名（如：廣志）" class="flex-1 border-2 border-slate-800 rounded-lg p-1.5 text-sm bg-slate-50">
      <button onclick="addMember()" class="neo-btn bg-sky-300 font-bold px-3 py-1.5 rounded-lg text-sm">新增</button>
    </div>
  </div>

  <!-- 頁籤 2: 明細 -->
  <div id="page2" class="neo-card bg-white p-4 mb-4 hidden">
    <h2 class="font-black text-lg mb-3">📋 消費明細記錄</h2>
    <div id="expenseList" class="space-y-2">
      <!-- 動態載入明細 -->
    </div>
  </div>

  <!-- 頁籤 3: 結算 -->
  <div id="page3" class="neo-card bg-white p-4 mb-4 hidden">
    <h2 class="font-black text-lg mb-3">⚡ 智能分帳結算</h2>
    <div id="settlementList" class="space-y-2 mb-4">
      <!-- 動態載入結算 -->
    </div>
    <button onclick="copySettlement()" class="w-full neo-btn bg-green-400 font-black py-3 rounded-xl text-sm">
      📲 複製結算文字（傳到 LINE 群組）
    </button>
  </div>

  <script>
    // 匯率換算表 (相對於 TWD)
    const RATES = { TWD: 1, JPY: 0.21, KRW: 0.024, USD: 32.2 };
    
    // 初始化預設資料
    let members = JSON.parse(localStorage.getItem('shin_members')) || ['小新', '美冴', '廣志'];
    let expenses = JSON.parse(localStorage.getItem('shin_expenses')) || [];

    // 初始化 App
    function init() {
      renderMembers();
      renderExpenses();
      renderSettlement();
    }

    // 切換頁籤
    function switchTab(num) {
      [1, 2, 3].forEach(n => {
        document.getElementById(`page${n}`).classList.add('hidden');
        document.getElementById(`tab${n}`).classList.remove('active');
      });
      document.getElementById(`page${num}`).classList.remove('hidden');
      document.getElementById(`tab${num}`).classList.add('active');
    }

    // 渲染成員
    function renderMembers() {
      const listEl = document.getElementById('memberList');
      const selectEl = document.getElementById('itemPayer');
      const countEl = document.getElementById('memberCount');
      
      countEl.innerText = `${members.length} 人`;
      listEl.innerHTML = members.map((m, idx) => `
        <span class="bg-yellow-100 border border-slate-800 text-slate-800 font-bold text-xs px-2 py-1 rounded-md flex items-center gap-1">
          ${m}
          ${members.length > 1 ? `<button onclick="removeMember(${idx})" class="text-red-500 font-bold ml-1">✕</button>` : ''}
        </span>
      `).join('');

      selectEl.innerHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
    }

    // 新增成員
    function addMember() {
      const input = document.getElementById('newMemberName');
      const name = input.value.trim();
      if (name && !members.includes(name)) {
        members.push(name);
        input.value = '';
        saveData();
        renderMembers();
        renderSettlement();
      }
    }

    // 刪除成員
    function removeMember(idx) {
      members.splice(idx, 1);
      saveData();
      renderMembers();
      renderSettlement();
    }

    // 新增記帳
    function addExpense() {
      const title = document.getElementById('itemTitle').value.trim();
      const amount = parseFloat(document.getElementById('itemAmount').value);
      const currency = document.getElementById('itemCurrency').value;
      const category = document.getElementById('itemCategory').value;
      const payer = document.getElementById('itemPayer').value;

      if (!title || isNaN(amount) || amount <= 0) {
        alert('請輸入有效的消費名稱與金額！');
        return;
      }

      const newExpense = {
        id: Date.now(),
        title,
        amount,
        currency,
        category,
        payer,
        amountTWD: Math.round(amount * RATES[currency])
      };

      expenses.unshift(newExpense);
      saveData();
      
      // 清空輸入框
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemAmount').value = '';

      renderExpenses();
      renderSettlement();
      alert('✅ 記帳成功！動感光波逼逼逼～');
    }

    // 刪除記帳
    function deleteExpense(id) {
      expenses = expenses.filter(e => e.id !== id);
      saveData();
      renderExpenses();
      renderSettlement();
    }

    // 渲染帳目明細
    function renderExpenses() {
      const listEl = document.getElementById('expenseList');
      if (expenses.length === 0) {
        listEl.innerHTML = `<p class="text-center text-slate-400 py-6 text-sm font-bold">目前還沒有記帳紀錄喔！</p>`;
        return;
      }

      listEl.innerHTML = expenses.map(e => `
        <div class="border-2 border-slate-800 rounded-xl p-3 bg-slate-50 flex justify-between items-center">
          <div>
            <div class="font-black text-sm text-slate-800">${e.category.split(' ')[0]} ${e.title}</div>
            <div class="text-xs text-slate-500 font-bold">${e.payer} 付款 • ${e.currency} ${e.amount}</div>
          </div>
          <div class="text-right flex items-center gap-2">
            <div>
              <div class="font-black text-red-500 text-sm">NT$ ${e.amountTWD}</div>
            </div>
            <button onclick="deleteExpense(${e.id})" class="text-slate-400 hover:text-red-500 font-bold px-1">✕</button>
          </div>
        </div>
      `).join('');
    }

    // 計算並渲染分帳結算
    function renderSettlement() {
      const listEl = document.getElementById('settlementList');
      if (expenses.length === 0 || members.length === 0) {
        listEl.innerHTML = `<p class="text-center text-slate-400 py-6 text-sm font-bold">新增記帳後會自動計算結算！</p>`;
        return;
      }

      const totalTWD = expenses.reduce((sum, e) => sum + e.amountTWD, 0);
      const avgTWD = Math.round(totalTWD / members.length);

      // 計算每個人付出金額
      let paid = {};
      members.forEach(m => paid[m] = 0);
      expenses.forEach(e => {
        if (paid[e.payer] !== undefined) paid[e.payer] += e.amountTWD;
      });

      // 計算收支平衡
      let balances = {};
      members.forEach(m => balances[m] = paid[m] - avgTWD);

      // 拆分債權與債務
      let debtors = [], creditors = [];
      for (let m in balances) {
        if (balances[m] < -1) debtors.push({ name: m, amount: -balances[m] });
        if (balances[m] > 1) creditors.push({ name: m, amount: balances[m] });
      }

      let transactions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        let pay = Math.min(debtors[i].amount, creditors[j].amount);
        transactions.push({
          from: debtors[i].name,
          to: creditors[j].name,
          amount: Math.round(pay)
        });

        debtors[i].amount -= pay;
        creditors[j].amount -= pay;

        if (debtors[i].amount < 1) i++;
        if (creditors[j].amount < 1) j++;
      }

      let html = `
        <div class="bg-yellow-100 border-2 border-slate-800 rounded-xl p-3 mb-3 text-sm font-bold">
          <div>總消費：<span class="text-red-500 font-black">NT$ ${totalTWD}</span></div>
          <div>每人平均：<span class="text-blue-600 font-black">NT$ ${avgTWD}</span></div>
        </div>
      `;

      if (transactions.length === 0) {
        html += `<p class="text-center text-green-600 font-bold py-2">大家金額剛剛好，不需要給錢！</p>`;
      } else {
        html += transactions.map(t => `
          <div class="border-2 border-slate-800 rounded-xl p-2.5 bg-slate-50 text-sm font-bold flex justify-between items-center">
            <span>🔴 ${t.from} ➔ 🟢 ${t.to}</span>
            <span class="text-red-500 font-black">NT$ ${t.amount}</span>
          </div>
        `).join('');
      }

      listEl.innerHTML = html;
    }

    // 複製結算報告
    function copySettlement() {
      const totalTWD = expenses.reduce((sum, e) => sum + e.amountTWD, 0);
      const avgTWD = Math.round(totalTWD / (members.length || 1));

      let text = `🖍️ 【野原家出遊分帳報告】\n`;
      text += `💰 總消費：NT$ ${totalTWD}\n`;
      text += `👥 每人平均：NT$ ${avgTWD}\n`;
      text += `-------------------\n`;
      text += `⚡ 結算建議：\n`;

      const listItems = document.querySelectorAll('#settlementList div.bg-slate-50');
      if (listItems.length === 0) {
        text += `大家都結清囉！金額剛剛好！\n`;
      } else {
        listItems.forEach(item => {
          text += `${item.innerText.replace('\n', ' ')}\n`;
        });
      }

      navigator.clipboard.writeText(text).then(() => {
        alert('📋 結算報告已複製到剪貼簿！可直接貼到 LINE 群組！');
      }).catch(() => {
        alert('複製失敗，請手動選取文字複製。');
      });
    }

    // 儲存資料到 LocalStorage
    function saveData() {
      localStorage.setItem('shin_members', JSON.stringify(members));
      localStorage.setItem('shin_expenses', JSON.stringify(expenses));
    }

    // 頁面載入執行
    window.onload = init;
  </script>
</body>
</html>
